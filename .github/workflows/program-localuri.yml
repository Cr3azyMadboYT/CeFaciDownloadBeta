# Takes the businesses' opening hours from the Places API into public.place_hours (server only, kept at most 72 hours).
# Only by hand (since 31.10 the hours live 72 hours, so a monthly run would be wasted); writes nothing to the repo.
# Needs the secrets PLACES_API_KEY and SUPABASE_SERVICE_ROLE_KEY.
name: Programul localurilor

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Câte localuri (gol = toate)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  hours:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Programul de la Places API
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          SUPABASE_URL: https://vqrmwuarjjntusfbqprx.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIMIT: ${{ inputs.limit }}
        run: |
          if [ -n "$LIMIT" ]; then [[ "$LIMIT" =~ ^[0-9]+$ ]] || { echo "limit trebuie să fie un număr"; exit 1; }; node scripts/fetch-hours.mjs --limit "$LIMIT"; else node scripts/fetch-hours.mjs; fi
