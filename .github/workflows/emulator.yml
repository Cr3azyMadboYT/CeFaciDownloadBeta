# The app on a real Android (an emulator on GitHub), with the 3 buttons at the bottom like Cornel's Samsung: it
# installs the APK, sets the clock (20:30, 23:30, 01:30 on a Friday), goes through the screens and writes in the log
# what it saw — where the app ends and the phone's buttons begin, every button's place, and small photos (between
# =====SHOT lines, base64). The test build starts already signed up (EXPO_PUBLIC_E2E=1); the APK people install
# never does. Started by hand (Actions → Verificare pe emulator → Run workflow).
name: Verificare pe emulator

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Încearcă și APK-ul unui run „Aplicația Android” (doar primul ecran, fără cont). Gol = nu.'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Dependențele
        working-directory: mobile
        run: npm ci
      - name: Proiectul Android nativ
        working-directory: mobile
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install
      - name: APK-ul de test (doar pentru emulator)
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_E2E: '1'
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  shots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        clock: ['2030', '2330', '0130']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: e2e-apk
          path: apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/e2e/shots.sh apk/app-release.apk e2e ${{ matrix.clock }}

  release:
    if: inputs.run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: CeFaci-android-*
          merge-multiple: true
          path: apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/e2e/shots.sh "$(ls apk/*.apk | head -1)" release 2030
