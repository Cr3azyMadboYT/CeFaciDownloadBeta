name: Client, Business și Admin · builduri reale
on:
  push:
    branches: [claude/new-session-hzbjtf, main, codex/cefaci-client-business-20261008]
    paths-ignore: ['docs/**', 'handoff/**', '*.md']
  workflow_dispatch:
    inputs:
      app:
        description: Aplicația de construit
        type: choice
        default: both
        options: [both, client, business]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            business/package-lock.json
      - run: npm ci
      - name: Conexiuni PostgreSQL simultane
        run: |
          node scripts/test-business-concurrency.mjs
          node scripts/test-admin-concurrency.mjs
        env:
          CEFACI_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:55432/postgres
      - run: npm ci && npm run typecheck
        working-directory: mobile
      - run: npm ci && npm run typecheck
        working-directory: business
      - run: npx vitest run
      - name: Admin static pentru gazduire.net
        run: npm run admin:typecheck && npm run admin:build && npm run admin:package
      - name: Web static pentru gazduire.net
        working-directory: business
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npm run web
      - run: node scripts/package-business-web.mjs
      - name: Export Client pentru verificarea integrării
        working-directory: mobile
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform web --output-dir /tmp/cefaci-client-admin-web
      - name: Fluxuri Client, Business și Admin în browser, cu backend sintetic izolat
        run: |
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 --directory business/dist > /tmp/cefaci-web-test.log 2>&1 &
          WEB_TEST_PID=$!
          python3 -m http.server 4175 --bind 127.0.0.1 --directory admin/dist > /tmp/cefaci-admin-test.log 2>&1 &
          ADMIN_TEST_PID=$!
          python3 -m http.server 4177 --bind 127.0.0.1 --directory /tmp/cefaci-client-admin-web > /tmp/cefaci-client-test.log 2>&1 &
          CLIENT_TEST_PID=$!
          trap 'kill "$WEB_TEST_PID" "$ADMIN_TEST_PID" "$CLIENT_TEST_PID"' EXIT
          node scripts/test-business-ui.mjs
          node scripts/test-business-onboarding-ui.mjs
          node scripts/test-support-ui.mjs
          node scripts/test-admin-ui.mjs
          node scripts/test-security-tutorial-ui.mjs
          node scripts/test-security-hook-ui.mjs
          node scripts/test-client-support-ui.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: CeFaci-Business-flow-screenshots
          path: release/screenshots/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: CeFaci-Business-web
          path: release/CeFaci-Business-web.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: CeFaci-Admin-web
          path: release/CeFaci-Admin-web.zip
          if-no-files-found: error
  native:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.app == 'business' && '[{"folder":"business","name":"CeFaci-Business"}]' || inputs.app == 'client' && '[{"folder":"mobile","name":"CeFaci-Client"}]' || '[{"folder":"mobile","name":"CeFaci-Client"},{"folder":"business","name":"CeFaci-Business"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            business/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm ci
        working-directory: ${{ matrix.folder }}
      - name: Firebase Client (dacă secretul există)
        if: matrix.folder == 'mobile'
        working-directory: mobile
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: if [ -n "$GS" ]; then printf '%s' "$GS" > google-services.json; fi
      - name: Generează proiectele native Android și iOS
        working-directory: ${{ matrix.folder }}
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --no-install
      - name: Cheia de semnare
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.CEFACI_KEYSTORE_B64 }}
          STORE_PW: ${{ secrets.CEFACI_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.CEFACI_KEY_ALIAS }}
          KEY_PW: ${{ secrets.CEFACI_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cefaci.jks"
          mkdir -p ~/.gradle
          {
            echo "CEFACI_KEYSTORE=$RUNNER_TEMP/cefaci.jks"
            echo "CEFACI_KEYSTORE_PASSWORD=$STORE_PW"
            echo "CEFACI_KEY_ALIAS=$ALIAS"
            echo "CEFACI_KEY_PASSWORD=$KEY_PW"
          } >> ~/.gradle/gradle.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Construiește APK
        working-directory: ${{ matrix.folder }}/android
        env:
          EXPO_PUBLIC_ESRI_MAPS_KEY: ${{ secrets.ESRI_MAPS_KEY }}
        run: ./gradlew assembleRelease --no-daemon --max-workers=2
      - name: AAB semnat pentru Play
        if: steps.sign.outputs.signed == 'true'
        working-directory: ${{ matrix.folder }}/android
        env:
          EXPO_PUBLIC_ESRI_MAPS_KEY: ${{ secrets.ESRI_MAPS_KEY }}
        run: ./gradlew bundleRelease --no-daemon --max-workers=2
      - name: Pachetul de livrare
        run: |
          mkdir -p release
          cp "${{ matrix.folder }}/android/app/build/outputs/apk/release/app-release.apk" "release/${{ matrix.name }}.apk"
          if [ -d "${{ matrix.folder }}/android/app/build/outputs/bundle/release" ]; then cp "${{ matrix.folder }}"/android/app/build/outputs/bundle/release/*.aab "release/${{ matrix.name }}.aab"; fi
          zip -qr "release/${{ matrix.name }}-ios-project.zip" "${{ matrix.folder }}/ios"
          printf '%s\n' "Commit ${{ github.sha }}" "Semnare productie ${{ steps.sign.outputs.signed }}" > "release/${{ matrix.name }}-build.txt"
          SDK_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$SDK_TOOLS/apksigner" verify --verbose --print-certs "release/${{ matrix.name }}.apk" >> "release/${{ matrix.name }}-build.txt"
          "$SDK_TOOLS/aapt" dump badging "release/${{ matrix.name }}.apk" | head -1 >> "release/${{ matrix.name }}-build.txt"
          sha256sum release/* > "release/${{ matrix.name }}-SHA256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-native
          path: release/*
          if-no-files-found: error
      - name: Curățenie
        if: always()
        run: rm -f "$RUNNER_TEMP/cefaci.jks" ~/.gradle/gradle.properties
