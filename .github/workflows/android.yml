# Builds the Android app on GitHub (no PC needed). The APK is attached to each run under "Artifacts".
# The app is native (React Native, folder mobile/): real Android screens, not a web page.
# Signing uses four repository secrets (Settings → Secrets and variables → Actions):
#   CEFACI_KEYSTORE_B64 (the .jks file, base64), CEFACI_KEYSTORE_PASSWORD, CEFACI_KEY_ALIAS, CEFACI_KEY_PASSWORD.
# Without them the APK is signed with a test key: it installs and runs, but Google sign-in needs the real key.
name: Aplicația Android

on:
  push:
    branches: [claude/new-session-hzbjtf, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Testele (motorul de căutare, contul, baza de date)
        run: |
          npm ci
          npx vitest run
      - name: Aplicația de telefon (verificare)
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit
      - name: Firebase (notificările de la prieteni, din secretul GOOGLE_SERVICES_JSON)
        working-directory: mobile
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then printf '%s' "$GS" > google-services.json; echo "Firebase: da"; else echo "Firebase: încă nu (fără notificări de la prieteni)"; fi
      - name: Proiectul Android nativ
        working-directory: mobile
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install
      - name: Cheia de semnare (din secrete)
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.CEFACI_KEYSTORE_B64 }}
          STORE_PW: ${{ secrets.CEFACI_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.CEFACI_KEY_ALIAS }}
          KEY_PW: ${{ secrets.CEFACI_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cefaci.jks"
          mkdir -p ~/.gradle
          {
            echo "CEFACI_KEYSTORE=$RUNNER_TEMP/cefaci.jks"
            echo "CEFACI_KEYSTORE_PASSWORD=$STORE_PW"
            echo "CEFACI_KEY_ALIAS=$ALIAS"
            echo "CEFACI_KEY_PASSWORD=$KEY_PW"
          } >> ~/.gradle/gradle.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: APK (pentru telefon)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: AAB (pentru Google Play, doar cu cheia reală)
        if: steps.sign.outputs.signed == 'true'
        working-directory: mobile/android
        run: ./gradlew bundleRelease --no-daemon
      - name: Numele fișierului
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "out/CeFaci-${{ github.run_number }}.apk"
          if [ -d mobile/android/app/build/outputs/bundle/release ]; then cp mobile/android/app/build/outputs/bundle/release/*.aab "out/CeFaci-${{ github.run_number }}.aab"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: CeFaci-android-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
      - name: Curățenie
        if: always()
        run: rm -f "$RUNNER_TEMP/cefaci.jks" ~/.gradle/gradle.properties
