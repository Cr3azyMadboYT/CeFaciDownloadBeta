# Checks every place against Google Maps (Places API) and leaves out the ones closed for good or for a while.
# Runs by hand (Actions → "Verifică locurile" → Run workflow) and every month on the 2nd, after the OSM update.
# Needs the repository secret PLACES_API_KEY (a Google Cloud key with "Places API (New)" on). The list of what was
# found is on the run's page; the data is saved only if the tests pass.
name: Verifică locurile

on:
  schedule:
    - cron: '17 4 2 * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Câte locuri (gol = toate)'
        required: false
        default: ''
      rate:
        description: 'Caută și locurile bine cotate (nivelul 2; ~1.600 de verificări, primele 1.000 pe lună gratis)'
        type: boolean
        required: false
        default: false
      from_run:
        description: 'Ia rezultatul unei rulări de dinainte (numărul ei), fără să mai întrebe Google'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: osm-data
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rezultatul de dinainte
        if: inputs.from_run != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.from_run }}
          github-token: ${{ github.token }}
          pattern: verificare-*
          merge-multiple: true
          path: .
      - name: Verificarea pe Google Maps
        if: inputs.from_run == ''
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          LIMIT: ${{ inputs.limit }}
        run: |
          if [ -z "$PLACES_API_KEY" ]; then echo "Lipsește secretul PLACES_API_KEY: verificarea n-a rulat (locurile rămân ca înainte)." >> "$GITHUB_STEP_SUMMARY"; echo "skip=1" >> "$GITHUB_ENV"; exit 0; fi
          if [ -n "$LIMIT" ]; then [[ "$LIMIT" =~ ^[0-9]+$ ]] || { echo "limit trebuie să fie un număr"; exit 1; }; node scripts/verify-places.mjs --limit "$LIMIT"; else node scripts/verify-places.mjs; fi
          cat docs/verificare-locuri.md >> "$GITHUB_STEP_SUMMARY"
      - name: Locurile bine cotate (nivelul 2)
        if: env.skip != '1' && inputs.rate && inputs.from_run == ''
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          LIMIT: ${{ inputs.limit }}
        run: |
          if [ -n "$LIMIT" ]; then [[ "$LIMIT" =~ ^[0-9]+$ ]] || { echo "limit trebuie să fie un număr"; exit 1; }; node scripts/rate-places.mjs --limit "$LIMIT"; else node scripts/rate-places.mjs; fi
          cat docs/locuri-bine-cotate.md >> "$GITHUB_STEP_SUMMARY"
      - name: Localurile fără cele închise
        if: env.skip != '1'
        run: |
          node scripts/import-osm.mjs data-raw/osm-bucuresti-ilfov.json
          TZ=Europe/Bucharest node scripts/build-hours.mjs
      - name: Testele
        id: tests
        if: env.skip != '1'
        continue-on-error: true
        run: npx vitest run
      - uses: actions/upload-artifact@v4
        if: always() && env.skip != '1'
        with:
          name: verificare-${{ github.run_number }}
          path: |
            docs/verificare-locuri.md
            docs/locuri-bine-cotate.md
            src/data/checked.json
            src/data/rated.json
      - name: Salvează în repo
        if: steps.tests.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # the branch may have moved meanwhile (the OSM update rewrites the same files): start from the newest copy,
          # put back only our verdicts, and make the places again from them
          mkdir -p /tmp/keep && cp src/data/checked.json /tmp/keep/ && cp docs/verificare-locuri.md /tmp/keep/ 2>/dev/null || true
          cp src/data/rated.json docs/locuri-bine-cotate.md /tmp/keep/ 2>/dev/null || true
          for i in 1 2 3; do
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard "origin/${GITHUB_REF_NAME}"
            cp /tmp/keep/checked.json src/data/; cp /tmp/keep/verificare-locuri.md docs/ 2>/dev/null || true
            [ -f /tmp/keep/rated.json ] && cp /tmp/keep/rated.json src/data/ && cp /tmp/keep/locuri-bine-cotate.md docs/ 2>/dev/null || true
            node scripts/import-osm.mjs data-raw/osm-bucuresti-ilfov.json
            TZ=Europe/Bucharest node scripts/build-hours.mjs
            npx vitest run > /tmp/tests.log 2>&1 || { tail -40 /tmp/tests.log; echo "**Testele au picat după actualizare.** Nu s-a salvat." >> "$GITHUB_STEP_SUMMARY"; exit 1; }
            git add src/data/checked.json src/data/venues.json src/data/venues-meta.json src/data/gone.json docs/verificare-locuri.md data-raw/candidates.json
            git add src/data/rated.json docs/locuri-bine-cotate.md 2>/dev/null || true
            if git diff --cached --quiet; then echo "Nimic nou"; exit 0; fi
            git commit -q -m "Locuri verificate pe Google Maps ($(date -u +%F))"
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 15
          done
          exit 1
      - name: Locurile în Supabase
        if: steps.tests.outcome == 'success'
        env:
          SUPABASE_URL: https://vqrmwuarjjntusfbqprx.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/push-venues.mjs
      - name: Testele au picat
        if: env.skip != '1' && steps.tests.outcome != 'success'
        run: echo "**Testele au picat cu locurile scoase.** Datele nu s-au salvat; lista e în Artifacts." >> "$GITHUB_STEP_SUMMARY"
