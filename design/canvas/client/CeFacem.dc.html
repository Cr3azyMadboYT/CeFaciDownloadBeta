<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&amp;family=Instrument+Sans:wdth,wght@75..100,400..700&amp;family=Caveat:wght@500..700&amp;display=swap">
<style>
body{margin:0;background:#E9EBF2}
.cf{--bg:#0B1030;--s1:#141B45;--s2:#1D2660;--line:#2B3575;--ink:#F3F5FF;--ink2:#A9B1DA;--ink3:#8690C4;--blue:#2F5BFF;--blue-ink:#8EA6FF;--blue-soft:rgba(47,91,255,.2);--yellow:#FFD43B;--yellow-ink:#FFD43B;--yellow-soft:rgba(255,212,59,.16);--coral:#FF6A4D;--coral-ink:#FF8A73;--coral-soft:rgba(255,106,77,.16);--violet:#8C6CFF;--violet-ink:#B7A3FF;--violet-soft:rgba(140,108,255,.2);--navy:#0E1440;--scrim:rgba(4,7,24,.66);font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
.cf.light{--bg:#EEF1FB;--s1:#FFFFFF;--s2:#E6EAF8;--line:#D3D9EF;--ink:#0E1440;--ink2:#454E7E;--ink3:#5A6390;--blue-ink:#2447E0;--blue-soft:rgba(47,91,255,.12);--yellow-ink:#7A5E00;--yellow-soft:rgba(255,212,59,.3);--coral-ink:#A8341C;--coral-soft:rgba(255,106,77,.14);--violet-ink:#5B3FD9;--violet-soft:rgba(140,108,255,.14);--scrim:rgba(14,20,64,.42)}
.cf{--doodle:#FFFFFF;--doodle-o:.06;isolation:isolate}
.cf.day{--bg:#E8EBF2;--s1:#FFFFFF;--s2:#DCE0EA;--line:#D2D7E3;--sheet:#FFFFFF;--doodle:#0E1440;--doodle-o:.085}
.cf.graphite{--bg:#121215;--s1:#1C1C21;--s2:#28282F;--line:#35353D;--ink:#F4F4F6;--ink2:#B7B7C1;--ink3:#90909B;--slot:#000000;--scrim:rgba(0,0,0,.62);--doodle:#FFFFFF;--doodle-o:.07}
.doodles{position:absolute;left:0;top:0;width:390px;height:844px;z-index:-1;pointer-events:none;color:var(--doodle);opacity:var(--doodle-o)}
.cf *{box-sizing:border-box}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:16px;height:16px}
.press{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .14s cubic-bezier(.23,1,.32,1),background-color .2s ease}
.press:active{transform:scale(.97)}
.chip{cursor:pointer;-webkit-tap-highlight-color:transparent;background:var(--s1);border:1px solid var(--line);color:var(--ink);transition:transform .45s cubic-bezier(.34,1.56,.64,1),background-color .18s ease,border-color .18s ease,color .18s ease}
@supports (transition-timing-function:linear(0,1)){.chip{transition:transform .45s linear(0,.044,.154,.298,.453,.604,.738,.85,.938,1.002,1.046,1.071,1.082,1.083,1.076,1.066,1.053,1.04,1.028,1.018,1.009,1.003,.998,.995,1),background-color .18s ease,border-color .18s ease,color .18s ease}}
.chip.on{background:var(--blue);border-color:var(--blue);color:#FFFFFF;transform:scale(1.03)}
.chip.multi.on{background:var(--violet-soft);border-color:var(--violet);color:var(--ink)}
.chip:active{transform:scale(.95)}
@media (hover:hover) and (pointer:fine){.chip:not(.on):hover{border-color:var(--ink3)}.press:hover{filter:brightness(1.07)}}
.cf :focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.cf.light :focus-visible{outline-color:#2447E0}
.sheet{animation:sheet .55s cubic-bezier(.32,.72,0,1) both}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.scrim{animation:fade .3s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.cf *,.cf *::before,.cf *::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</helmet>
<div class="cf {{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--ink)">

<div aria-hidden="true" style="padding: 52px 20px 0; display: flex; align-items: center; justify-content: space-between; height: 96px">
<span style="display: flex; align-items: center; gap: 6px; font: 650 16px/1 'Instrument Sans', system-ui, sans-serif">Buftea</span>
<span aria-hidden="true" style="width: 34px; height: 34px; flex: none; display: block; border-radius: 999px; overflow: hidden;"><svg viewBox="18 26 64 64" aria-hidden="true" style="display: block; width: 100%; height: 100%"><rect width="100" height="125" fill="#FFD43B"></rect><circle cx="82" cy="20" r="26" fill="#FFE58A"></circle><path d="M8 125 C10 98 29 88 50 88 C71 88 90 98 92 125 Z" fill="#FF6A4D"></path><path d="M43 70 H57 V92 H43 Z" fill="#D9967A"></path><ellipse cx="50" cy="56" rx="18" ry="21" fill="#EDB08F"></ellipse><path d="M31 60 C27 37 39 28 51 29 C64 30 72 40 69 57 C66 47 58 42 47 43 C39 44 34 50 33 61 Z" fill="#0E1440"></path></svg></span>
</div>
<div class="scrim" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: var(--scrim)"></div>

<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; top: 96px; bottom: 0; padding: 8px 20px 24px; border-radius: 28px 28px 0 0; background: var(--sheet, var(--s1)); display: flex; flex-direction: column">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--line)"></span>

<div style="margin-top: 12px; display: flex; align-items: center; justify-content: space-between; height: 44px">
<h1 id="sheet-title" style="margin: 0; font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif; font-size: 30px; line-height: 1; font-weight: 760; font-stretch: 90%; letter-spacing: -0.02em">Ce facem?</h1>
<a href="Main.dc.html" class="press" aria-label="Închide" style="width: 44px; height: 44px; margin-right: -8px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--s2); color: var(--ink)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></a>
</div>

<div style="margin-top: 10px; display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 8px">
<p id="{{r.id}}" style="margin: 0; font: 650 15px/1.2 'Instrument Sans', system-ui, sans-serif; color: var(--ink2)">{{r.label}}</p>
<div role="group" aria-labelledby="{{r.id}}" style="display: flex; gap: 8px">
<sc-for list="{{r.opts}}" as="o" hint-placeholder-count="4">
<button type="button" class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="flex: 1 1 0; height: 44px; border-radius: 999px; font: 650 15px/1 'Instrument Sans', system-ui, sans-serif">{{o.label}}</button>
</sc-for>
</div>
</div>
</sc-for>

<div style="display: flex; flex-direction: column; gap: 8px">
<p id="lbl-buget" style="margin: 0; font: 650 15px/1.2 'Instrument Sans', system-ui, sans-serif; color: var(--ink2)">Buget de persoană, în lei</p>
<div role="group" aria-labelledby="lbl-buget" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{budget}}" as="o" hint-placeholder-count="5">
<button type="button" class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="flex: 0 0 auto; height: 44px; padding: 0 18px; border-radius: 999px; font: 650 15px/1 'Instrument Sans', system-ui, sans-serif">{{o.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<p id="lbl-vibe" style="margin: 0; font: 650 15px/1.2 'Instrument Sans', system-ui, sans-serif; color: var(--ink2)">Ce vibe? <span style="font-weight: 500; color: var(--ink3)">Opțional, oricâte</span></p>
<div role="group" aria-labelledby="lbl-vibe" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{vibes}}" as="o" hint-placeholder-count="6">
<button type="button" class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="flex: 0 0 auto; height: 44px; padding: 0 16px; border-radius: 999px; font: 600 15px/1 'Instrument Sans', system-ui, sans-serif">{{o.label}}</button>
</sc-for>
</div>
</div>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<button type="button" class="press" style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--line); background: transparent; color: var(--ink2); font: 550 14px/1 'Instrument Sans', system-ui, sans-serif">
<svg class="i s" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--coral-ink)"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>
<span style="color: var(--ink)">Lângă Buftea</span>
<svg class="i s" viewBox="0 0 24 24" aria-hidden="true" style="margin-left: 6px"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path><circle cx="7" cy="17" r="2"></circle><path d="M9 17h6"></path><circle cx="17" cy="17" r="2"></circle></svg>
<span>cu mașina, max. 20 min</span>
</button>
<a href="Rezultate.dc.html" class="press" style="height: 56px; border-radius: 18px; background: var(--blue); color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font: 650 17px/1 'Instrument Sans', system-ui, sans-serif">Arată 3 variante</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["zi","noapte"],"default":"zi","section":"Temă"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { who: '34', when: 'eve', dur: '23', budget: '100', vibes: ['Fun', 'Competitiv'] };
  }
  renderVals() {
    const theme = this.props.theme ?? 'zi';
    const single = [
      { key: 'who', label: 'Cine vine?', opts: [['1', 'Doar eu'], ['2', 'În doi'], ['34', '3–4'], ['5', '5+']] },
      { key: 'when', label: 'Când?', opts: [['now', 'Acum'], ['eve', 'Diseară'], ['tom', 'Mâine'], ['we', 'Weekend']] },
      { key: 'dur', label: 'Cât timp aveți?', opts: [['1', '1 oră'], ['23', '2–3 ore'], ['4', '4+ ore']] }
    ];
    const rows = single.map((r) => ({
      id: 'lbl-' + r.key,
      label: r.label,
      opts: r.opts.map(([id, label]) => ({
        label,
        cls: this.state[r.key] === id ? 'chip on' : 'chip',
        pressed: this.state[r.key] === id,
        pick: () => this.setState({ [r.key]: id })
      }))
    }));
    const budgetOpts = [['0', 'Gratuit'], ['50', '≤ 50'], ['100', '≤ 100'], ['200', '≤ 200'], ['any', 'Oricât']];
    const budget = budgetOpts.map(([id, label]) => ({
      label,
      cls: this.state.budget === id ? 'chip on' : 'chip',
      pressed: this.state.budget === id,
      pick: () => this.setState({ budget: id })
    }));
    const vibeList = ['Chill', 'Fun', 'Competitiv', 'Aer liber', 'Mâncare bună', 'Cultură'];
    const vibes = vibeList.map((v) => {
      const on = this.state.vibes.indexOf(v) !== -1;
      return {
        label: v,
        cls: on ? 'chip multi on' : 'chip multi',
        pressed: on,
        pick: () => this.setState({ vibes: on ? this.state.vibes.filter((x) => x !== v) : this.state.vibes.concat([v]) })
      };
    });
    return { themeClass: ({ zi: 'light day', noapte: 'graphite', luminos: 'light day', 'hârtie': 'light day', grafit: 'graphite' })[theme] ?? 'light day', rows, budget, vibes };
  }
}
</script>
</body>
</html>
